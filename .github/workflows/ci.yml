name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Los lunes a las 06:00 UTC. Las auditorías de dependencias tienen que
    # correr aunque el repo esté quieto: un aviso de seguridad puede salir
    # semanas después del último commit.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  python:
    name: Tests y lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar
        run: pip install -e ".[dev]"

      # El contraste es computable, así que se computa. Encontró un verde a
      # 4,36:1 que a ojo era perfectamente legible — que es justo el motivo por
      # el que no se puede dejar al ojo.
      - name: Contraste de color (WCAG AA)
        run: python scripts/check_contrast.py

      # La web lee las métricas del payload; la documentación las tenía escritas
      # a mano y llevaba meses publicando las del proyecto ORIGINAL del autor.
      # Nada falla cuando eso pasa —es prosa— así que se comprueba: las cuatro
      # cifras de portada contra `validation.overall`.
      - name: Cifras de portada contra el payload
        run: python scripts/check_headline_metrics.py

      - name: Lint
        run: ruff check src tests scripts

      # Los tests usan datos sintéticos (tests/conftest.py). No descargan los
      # ~490 MB de nflverse: un test que sólo pasa si alguien corrió `oracle
      # refresh` a mano no es un test.
      - name: Tests
        run: pytest -q

  web:
    name: Build y cabeceras (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Playwright está en devDependencies para que el arnés de capturas sea
      # reproducible, pero su postinstall se baja un Chromium de ~150 MB que aquí
      # no sirve para nada: CI no hace capturas. Sin esta variable, tres
      # workflows pagarían esa descarga en cada ejecución.
      - name: Instalar
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Build
        run: npm run build

      # El producto es en inglés. Esta comprobación mira el JSX **y descomprime
      # el payload**, que es por donde se coló el español que se vio en
      # producción: la pasada anterior sólo leía el código y daba verde.
      - name: Idioma de la interfaz
        run: node tools/audit-spanish.mjs

      # Aislamiento entre ligas y compilador de puntuación.
      # `next build` compila un identificador inexistente sin rechistar, y no hay
      # linter de JS aquí: /fantasy estuvo CUATRO DÍAS cayéndose en render por un
      # `const SLEEPER` borrado que dejó cuatro `fetch` usándolo. Esta
      # comprobación es estrecha a propósito —sólo interpolaciones de plantilla—
      # y por eso no tiene falsos positivos.
      - name: Identificadores huérfanos
        run: node tools/no-undef.mjs

      - name: Tests de JavaScript
        run: npm test

      # La simulación de draft no necesita navegador: tres ligas enteras contra
      # el board publicado, comprobando que la recomendación es coherente en
      # TODOS los turnos. Los laboratorios de Playwright no corren en CI; éste sí
      # puede, y es el que cubre el motor que decide qué se recomienda.
      - name: Simulación de draft (3 ligas)
        run: node tools/lab/draft-sim.mjs

      # Las cabeceras se comprueban CONTRA EL SERVIDOR REAL, no leyendo
      # next.config.mjs. La distinción importa: un config puede ser correcto y
      # no aplicarse, y entonces la comprobación estaría mirando el sitio
      # equivocado.
      - name: Verificar cabeceras de seguridad
        run: |
          npm run start &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000/; then break; fi
            sleep 1
          done

          headers=$(curl -sI http://localhost:3000/)
          echo "$headers"

          fail=0
          require() {
            if ! grep -iq "$1" <<< "$headers"; then
              echo "FALTA la cabecera: $1"
              fail=1
            fi
          }
          require "content-security-policy:"
          require "x-frame-options: DENY"
          require "x-content-type-options: nosniff"
          require "referrer-policy:"
          require "permissions-policy:"
          require "strict-transport-security: max-age=63072000"

          # Sin X-Powered-By: no hay motivo para anunciar la versión del framework.
          if grep -iq "x-powered-by:" <<< "$headers"; then
            echo "SOBRA la cabecera X-Powered-By"
            fail=1
          fi

          # La CSP lista **exactamente dos** dominios externos, cada uno en UNA
          # directiva: api.sleeper.app sólo en connect-src (el modo draft y la
          # cuenta enlazada leen la API pública) y sleepercdn.com sólo en img-src
          # (las fotos de los jugadores, por `sleeper_id`).
          #
          # El control no se ha quitado, se ha vuelto una lista blanca: cualquier
          # otro dominio, o uno de estos apareciendo en una directiva que no sea
          # la suya (script-src, por ejemplo, que sería mucho peor), falla el
          # build. Un control que se relaja «porque ahora hace falta una
          # excepción» y pasa a no comprobar nada es peor que no tenerlo, porque
          # deja la sensación de que algo vigila.
          csp=$(grep -i "content-security-policy:" <<< "$headers")
          externos=$(grep -oE "https?://[a-zA-Z0-9.-]+" <<< "$csp" | sort -u)
          esperados=$(printf "https://api.sleeper.app\nhttps://sleepercdn.com")
          if [ "$externos" != "$esperados" ]; then
            echo "Dominios externos inesperados en la CSP:"
            echo "$externos"
            fail=1
          fi
          if ! grep -qE "connect-src [^;]*https://api\.sleeper\.app" <<< "$csp" \
             || [ "$(grep -o "https://api.sleeper.app" <<< "$csp" | wc -l)" != "1" ]; then
            echo "api.sleeper.app tiene que estar en connect-src y en ninguna otra directiva."
            fail=1
          fi
          if ! grep -qE "img-src [^;]*https://sleepercdn\.com" <<< "$csp" \
             || [ "$(grep -o "https://sleepercdn.com" <<< "$csp" | wc -l)" != "1" ]; then
            echo "sleepercdn.com tiene que estar en img-src y en ninguna otra directiva."
            fail=1
          fi

          exit $fail

      # Una sola página pide red, y sólo a Sleeper. Ni HTML crudo en ninguna.
      - name: Acotar las peticiones de runtime y prohibir dangerouslySetInnerHTML
        run: |
          if grep -rn "dangerouslySetInnerHTML" app data; then
            echo "dangerouslySetInnerHTML no está permitido en este proyecto."
            exit 1
          fi

          # `fetch` sólo puede aparecer en el ADAPTADOR DE SLEEPER y en la
          # pantalla que lo usaba antes de extraerlo. En cualquier otro sitio
          # significa que una página que se anuncia como estática ha empezado a
          # pedir cosas, que es exactamente lo que este control existe para
          # detectar. La lista se AMPLÍA a mano, fichero a fichero: un control
          # que se relaja hasta no comprobar nada es peor que no tenerlo.
          # DraftMode conserva sus PROPIAS peticiones, y no es duplicación del
          # adaptador: son el descubrimiento de ligas (buscar tu usuario, listar
          # tus ligas) — un flujo de configuración, no de sincronización. El
          # sondeo del draft vive sólo en `useSleeperDraft.js`.
          culpables=$(grep -rlE "\bfetch\(|XMLHttpRequest|new WebSocket" app data \
                      | grep -vE "^app/fantasy/(DraftMode.jsx|useSleeperDraft.js)$" || true)
          if [ -n "$culpables" ]; then
            echo "Peticiones de red fuera del modo draft:"
            echo "$culpables"
            exit 1
          fi

          # XHR y WebSocket no hacen falta ni ahí: si aparecen, alguien ha
          # metido una dependencia que abre un canal que la CSP no cubre igual.
          if grep -rEn "XMLHttpRequest|new WebSocket" app data; then
            echo "Sólo fetch, y sólo a Sleeper."
            exit 1
          fi

          # Y el destino tiene que ser Sleeper. Un fetch a otro host pasaría este
          # fichero pero lo bloquearía el navegador por CSP: mejor que falle aquí,
          # donde se lee el motivo, que en la consola de alguien en mitad de un draft.
          if grep -nE "\bfetch\(" app/fantasy/DraftMode.jsx app/fantasy/useSleeperDraft.js \
             | grep -qvE "SLEEPER|api\.sleeper\.app"; then
            echo "El adaptador sólo puede llamar a api.sleeper.app."
            exit 1
          fi

  dependencies:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Se audita la lista de dependencias, no el entorno.
      #
      # Auditando el entorno, pip-audit encuentra dentro al propio proyecto
      # instalado en editable, va a buscar `gridiron-oracle 0.1.0` a PyPI, no lo
      # encuentra —claro: no está publicado— y sale con error **antes de auditar
      # ninguna dependencia**. El job llevaba semanas en rojo por eso, que es el
      # peor modo de fallo de un control de seguridad: un rojo permanente por un
      # motivo ajeno es indistinguible de un rojo por una vulnerabilidad de
      # verdad, y se acaba ignorando.
      #
      # `--skip-editable` no vale como arreglo: choca con `--strict`, que trata
      # cualquier paquete no auditado como fallo. Y `--strict` es justo lo que no
      # se quiere perder — es lo que impide que algo deje de auditarse en
      # silencio. Con `pip freeze --exclude-editable` la lista sale ya sin el
      # proyecto, y se conserva entero.
      # Y PyPI corta la conexión de vez en cuando: el 5 de septiembre un
      # `ConnectionResetError` en pleno handshake TLS tumbó el job **antes de
      # mirar una sola dependencia**. Mismo tratamiento que `npm audit`, que ya
      # lo tenía resuelto dos pasos más abajo — no tenerlo aquí era la misma
      # cobertura incompleta de siempre, en un control de seguridad.
      #
      # Un fallo de red se distingue por el TRACEBACK de Python, no por la
      # palabra suelta: la salida de un hallazgo real es una tabla de paquetes,
      # así que exigir las dos cosas hace imposible confundir «no he podido
      # preguntar» con «no hay nada». Y si tras tres intentos sigue sin poder
      # consultarse, esto se queda en ROJO.
      - name: pip-audit
        run: |
          pip install pip-audit
          pip install -e ".[dev]"
          pip freeze --exclude-editable > /tmp/requirements-auditadas.txt
          echo "Auditando $(wc -l < /tmp/requirements-auditadas.txt) dependencias:"
          for intento in 1 2 3; do
            # `|| codigo=$?` y no `codigo=$?` a secas: los pasos corren con
            # `bash -e` y una asignación que falla aborta el paso antes de poder
            # leer su código, que es justo lo que hay que distinguir.
            codigo=0
            salida=$(timeout 300 pip-audit --strict -r /tmp/requirements-auditadas.txt 2>&1) || codigo=$?
            echo "$salida"
            [ "$codigo" -eq 0 ] && exit 0
            if [ "$codigo" -eq 124 ] || { grep -q "Traceback (most recent call last)" <<< "$salida" \
                 && grep -qE "ConnectionError|ConnectionResetError|Connection aborted|ReadTimeout|Read timed out|RemoteDisconnected|Temporary failure in name resolution|Max retries exceeded|ServiceUnavailable|50[0-9] Server Error" <<< "$salida"; }; then
              echo "::warning::pip-audit no ha podido consultar PyPI (intento $intento/3, código $codigo). Reintentando."
              sleep $((intento * 20))
              continue
            fi
            echo "::error::pip-audit ha encontrado vulnerabilidades."
            exit 1
          done
          echo "::error::PyPI no responde tras 3 intentos. NO se ha auditado nada: esto no es una auditoría limpia."
          exit 1

      # El endpoint de auditoría de npm devuelve 503 con cierta frecuencia. Se
      # reintenta tres veces, y si al final no se puede consultar esto sigue en
      # ROJO: «no he podido auditar» NO es «no hay vulnerabilidades», y un
      # control que se pone verde cuando no ha comprobado nada es peor que no
      # tenerlo (la lección del barrido diario que salía verde sin barrer). Lo
      # único que cambia es que el motivo se lee en el log.
      #
      # Los reintentos son MÍOS, no de npm: por defecto npm reintenta solo y
      # tarda SIETE MINUTOS en rendirse, así que tres intentos serían veintiuno
      # de runner sin sacar ninguna información. Con `--fetch-retries=1` npm se
      # rinde rápido y la espera la pone el bucle; `timeout` es el tope duro por
      # si un intento se cuelga sin devolver nada.
      - name: npm audit
        working-directory: web
        run: |
          for intento in 1 2 3; do
            # `|| codigo=$?` y no `codigo=$?` a secas: los pasos corren con
            # `bash -e`, y una asignación que falla aborta el paso antes de
            # poder leer su código — que es justo lo que hay que distinguir.
            codigo=0
            salida=$(timeout 300 npm audit --audit-level=moderate \
                       --fetch-retries=1 --fetch-retry-maxtimeout=10000 2>&1) || codigo=$?
            echo "$salida"
            [ "$codigo" -eq 0 ] && exit 0
            if [ "$codigo" -eq 124 ] || grep -qE "audit endpoint returned an error|Service Unavailable|ETIMEDOUT|ECONNRESET|ENOTFOUND|EAI_AGAIN" <<< "$salida"; then
              echo "::warning::npm no ha podido auditar (intento $intento/3, código $codigo). Reintentando."
              sleep $((intento * 20))
              continue
            fi
            echo "::error::npm audit ha encontrado vulnerabilidades."
            exit 1
          done
          echo "::error::El endpoint de auditoría de npm no responde tras 3 intentos. NO se ha auditado nada: esto no es una auditoría limpia."
          exit 1

  secrets:
    name: Escaneo de credenciales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # El historial COMPLETO, no el último commit. Una clave borrada sigue
          # viva en los commits anteriores, y es justo la que se escapa.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
