name: Laboratorios profundos (nocturno)

# Lo que NO corre por commit: cuesta minutos, simula drafts enteros por el
# adaptador de Sleeper o depende del reloj del navegador. Corre de madrugada
# y a mano. Un rojo aquí no bloquea un push; sí avisa.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  deep:
    name: live-assistant, cuenta, conectar, storage-blocked, matrix, reloj
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      - name: Chromium de Playwright
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Laboratorios profundos
        run: |
          # SE CORREN TODOS Y SE FALLA AL FINAL. Con `set -e` el primer laboratorio
          # en rojo paraba el bucle: `live-assistant` llevaba semanas fallando por
          # un motivo suyo y, detrás de él, `conectar` y `roster-isolation` tenían
          # un selector roto desde septiembre que no llegó a ejecutarse ni una
          # noche. Un control que falla cuesta UN control, no los de detrás.
          rojos=""
          for lab in live-assistant cuenta conectar storage-blocked live-assistant-matrix replay roster-isolation reloj; do
            echo "=== $lab"
            if ! SKIP_BUILD=1 node tools/lab/$lab.mjs; then rojos="$rojos $lab"; fi
          done
          if [ -n "$rojos" ]; then
            echo "::error::laboratorios en rojo:$rojos"
            exit 1
          fi
