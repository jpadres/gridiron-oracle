# Barrido DETERMINISTA de feeds — sin clave de modelo.
#
#     LA INGESTA Y EL JUICIO SON DOS ETAPAS Y FALLAN POR SEPARADO.
#
# `daily-research.yml` necesita `ANTHROPIC_API_KEY` y se pone en rojo sin ella,
# que es lo correcto para lo que ese workflow hace: juzgar. Bajar un RSS no
# necesita un modelo, y atarlo a la misma clave es la razón de que el registro
# de fuentes lleve 101 organizaciones clasificadas y CERO feeds leídos.
#
# Este job corre donde SÍ hay salida a los medios. Desde el contenedor de
# desarrollo la política de red deniega el CONNECT a los 101 dominios
# (`docs/RED_ENTORNOS.md`), así que es aquí —y no en una suposición— donde se
# comprueba qué feed contesta de verdad.
name: Feeds (determinista, sin clave)

on:
  schedule:
    # Cada seis horas. Un parte de lesiones del domingo caduca en horas; el
    # resto de lo que traen estos feeds, en días.
    - cron: "40 */6 * * *"
  workflow_dispatch:

# Dos ejecuciones a la vez se pisarían al escribir research/feeds_latest.json.
concurrency:
  group: research-feeds
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .

      - name: Barrer feeds
        # SIN `|| true` y SIN `continue-on-error`. El script sale con 1 cuando
        # ninguna fuente respondió, y eso TIENE que poner el job en rojo: un
        # barrido que sale verde sin barrer nada es exactamente el fallo que ya
        # se cometió con `daily-research.yml`, y deja la sensación de que algo
        # vigila cuando no.
        run: python scripts/feed_harvest.py --include-candidates

      - name: Resumen legible del barrido
        # OBSERVABLE SIN ABRIR EL LOG. La primera ejecución real salió VERDE con
        # 15 de 31 fuentes muertas (12 vacías, 3 con 404) y eso sólo se veía
        # desplazando cien líneas de log. El resumen del job lo pone en la
        # página de la ejecución.
        if: always()
        run: python scripts/feed_harvest.py --summary-only >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar lo leído
        # `git diff --quiet` NO VE UN FICHERO NUEVO: sólo compara lo que ya está
        # en el índice o en HEAD. `research/feeds_latest.json` no existía en el
        # repositorio, así que la primera ejecución real escribió las 292
        # entradas, preguntó «¿ha cambiado?», el fichero no estaba rastreado,
        # la respuesta fue «no» y el job salió VERDE sin publicar nada. Un
        # barrido que no puede publicar su PRIMER artefacto es exactamente el
        # «verde sin barrer nada» que este workflow existe para no repetir.
        #
        # Se añade PRIMERO y se compara contra el índice, que sí ve lo nuevo.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/feeds_latest.json
          if git diff --cached --quiet -- research/feeds_latest.json; then
            echo "Sin cambios en el artefacto de feeds."
            exit 0
          fi
          git commit -m "research: barrido determinista de feeds"
          # DOS WORKFLOWS QUE PUBLICAN EN LA MISMA RAMA SE PISAN. Pasó a los
          # cuarenta segundos de existir el segundo: el barrido de feeds
          # commiteó sus 292 entradas y el push salió rechazado porque el de
          # ADP había empujado primero. El trabajo estaba HECHO y se perdió.
          # Se reintenta sobre lo que haya llegado; el rebase es trivial porque
          # cada uno toca sólo su propio artefacto.
          for intento in 1 2 3; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push && exit 0
            echo "push rechazado (intento $intento), reintentando..."
            sleep $((intento * 5))
          done
          echo "no se pudo publicar tras tres intentos" >&2
          exit 1
