name: Research diario

on:
  schedule:
    # Todos los días a las 12:00 UTC. Después de que cierren las crónicas de la
    # mañana en la costa este y antes de los entrenamientos de la tarde.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      beats:
        description: "Beats a barrer, separados por comas (vacío = los catorce)"
        required: false
      effort:
        description: "Profundidad: low, medium, high"
        required: false
        default: medium

permissions:
  contents: write

concurrency:
  # Dos barridos a la vez escribirían el mismo fichero del día y se pisarían al
  # hacer push.
  group: daily-research
  cancel-in-progress: false

jobs:
  research:
    name: Barrer prensa e insiders
    runs-on: ubuntu-latest
    # Once beats con búsqueda web dentro. Con reintentos, media hora sobra.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar
        run: pip install -e ".[narrative]"

      # La clave sólo existe aquí. No está en el repo, no viaja al bundle de la
      # web y no aparece en ningún log: el SDK la lee del entorno y el código
      # nunca la nombra.
      - name: Barrido diario
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          args=""
          if [ -n "${{ inputs.beats }}" ]; then args="--beats ${{ inputs.beats }}"; fi
          if [ -n "${{ inputs.effort }}" ]; then args="$args --effort ${{ inputs.effort }}"; fi
          # SIN --require-key AQUÍ, Y ROJO AL FINAL DEL TRABAJO.
          #
          # El fallo por falta de clave se movió al ÚLTIMO paso, y no es un
          # detalle de orden: `research_build.py` BARRE con lo que no necesita
          # clave (`method: DETERMINISTIC_FEEDS`) y DESPUÉS devolvía 1, así que
          # el `--require-key` de aquí tumbaba el trabajo antes de publicar y
          # las fichas deterministas se escribían en el runner y se tiraban.
          #
          # Medido el 23 de septiembre de 2026: el archivo llevaba congelado
          # desde el 13 —DIEZ días— con 2.112 entradas de feeds frescas en el
          # repositorio y la sección de Research VACÍA en la web, que es el
          # «dato computado que no llega a la pantalla» otra vez. El arreglo de
          # la rama sin clave estaba escrito y este paso impedía que corriera.
          #
          # Las dos propiedades se conservan y no se estorban: se publica lo que
          # sí se pudo barrer, y el trabajo acaba en ROJO para que la clave que
          # falta se vea. Lo que no puede volver a pasar es salir VERDE sin
          # clave, que es lo que pasó el 30 y el 31 de agosto de 2026.
          python scripts/research_build.py $args

      # El payload de la web se regenera SIN reentrenar el modelo: el barrido no
      # toca los números, sólo añade la sección de prensa. Reentrenar aquí a
      # diario serían cuatro minutos de CPU para cambiar texto.
      - name: Refrescar la sección de research del payload
        run: python scripts/research_patch.py

      - name: Comprobar que la web sigue construyendo
        working-directory: web
        # Playwright está en devDependencies por el arnés de capturas; su
        # postinstall se baja un Chromium de ~150 MB que aquí no se usa.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci
          npm run build

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research web/data/model.b64.js
          if git diff --cached --quiet; then
            echo "Sin novedades hoy; no hay nada que publicar."
            exit 0
          fi
          # El mensaje describe lo que PASÓ, no lo que se pretendía. Si el
          # barrido no dejó fichero del día, esto no fue un barrido: fue una
          # reconsolidación del archivo, y decir otra cosa convierte el
          # historial de git en un registro falso de actividad diaria.
          hoy="$(date -u +%Y-%m-%d)"
          if git diff --cached --name-only | grep -q "^research/$hoy.json"; then
            git commit -m "research: barrido del $hoy"
          else
            git commit -m "research: reconsolidar el archivo ($hoy, sin fichas nuevas)"
          fi
          git push

      # EL ROJO VA AQUÍ, DESPUÉS DE PUBLICAR.
      #
      # Sin clave el barrido es determinista: trae el hecho de los feeds y no el
      # juicio (`kind`, `impact`, `confidence`, `fantasy_relevance` no se
      # escriben). Eso es MENOS de lo que este trabajo existe para hacer, así
      # que el trabajo no puede decir que salió bien — pero lo que sí barrió ya
      # está publicado dos pasos más arriba.
      - name: Exigir la clave (después de haber publicado lo que sí se pudo)
        # El contexto `secrets` NO está disponible en un `if:` de paso, así que
        # la comprobación se hace en el shell con la variable de entorno. El
        # VALOR nunca se imprime —sólo si está vacía—, que es la misma regla que
        # sigue el resto del repositorio con esta clave.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "Clave presente: el barrido de arriba fue el completo."
            exit 0
          fi
          echo "MISSING_SECRET: ANTHROPIC_API_KEY" >&2
          echo "El barrido corrió en modo DETERMINISTIC_FEEDS y lo que pudo leer está" >&2
          echo "publicado, pero sin clave no hay clasificación: las fichas salen sin" >&2
          echo "kind, impact, confidence ni fantasy_relevance, y «Today's Intelligence»" >&2
          echo "—que filtra por relevancia >= 4— se queda vacío." >&2
          exit 1
