[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridiron-oracle"
version = "0.1.0"
description = "Modelo de pronóstico NFL: margen, total, probabilidad de victoria y detección de valor frente al mercado"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jorge Padres Perez" }]
keywords = ["nfl", "sports-analytics", "elo", "epa", "betting", "forecasting"]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyarrow>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "hypothesis>=6.100"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# Textos generados y barrido de prensa. Extra y no dependencia: el modelo, el
# backtest y la web funcionan enteros sin esto, y quien clone el repo para mirar
# los números no tiene por qué instalarse un SDK que no va a poder usar sin clave.
narrative = ["anthropic>=0.122"]

[project.scripts]
oracle = "oracle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]        # sys.path se ajusta antes de importar el paquete
"tests/*" = ["E702", "SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
